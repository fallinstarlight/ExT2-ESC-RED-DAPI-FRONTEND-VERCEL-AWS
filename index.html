<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Catalog</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Music&nbsp;Catalog</h1>
      <span id="modeLabel">Artists &amp; People</span>
    </div>

    <div class="toggle" id="toggle" role="tablist">
      <div class="pill" id="pill"></div>
      <button class="active" data-mode="artists" role="tab">Artists</button>
      <button data-mode="albums" role="tab">Music</button>
    </div>
  </header>

  <!-- Search + advanced filters -->
  <form class="search" id="searchForm">
    <input id="q" type="text" placeholder="Search…" autocomplete="off" spellcheck="false" />
    <select id="genre" title="Genre"></select>
    <input id="year" type="number" placeholder="Year" min="1900" max="2100" class="narrow" />
    <button id="go" type="submit">Search</button>
  </form>

  <section class="results">
    <div class="results-head">
      <span id="headLeft">Results</span>
      <span id="headRight">&nbsp;</span>
    </div>
    <div class="results-body" id="body">
      <div class="state">Type something and hit <strong>Search</strong>.</div>
    </div>
  </section>
</div>

<!-- Detail drawer (used for artist/album/people details) -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-card" role="dialog" aria-modal="true">
    <button class="drawer-close" id="drawerClose" aria-label="Close">×</button>
    <div id="drawerBody"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
