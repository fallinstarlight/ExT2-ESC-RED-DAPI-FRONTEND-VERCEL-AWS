<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Music Catalog</title>
<style>
  :root {
    --coal-0:  #0d0d0f;
    --coal-1:  #141417;
    --coal-2:  #1b1b1f;
    --coal-3:  #26262b;
    --edge:    #35353c;
    --text:    #e8e6e3;
    --muted:   #8b8a90;
    --accent:  #c9a96a;
    --accent-2:#e0c48a;
    --radius:  10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;                 /* page never scrolls */
    background: radial-gradient(circle at 20% 0%, #191920 0%, var(--coal-0) 60%);
    color: var(--text);
    font-family: "Century Gothic", "CenturyGothic", "AppleGothic",
                 "URW Gothic", "Avant Garde", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 24px 20px;
  }

  /* ─── Header ─────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--edge);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .brand h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .brand span {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* Toggle */
  .toggle {
    display: inline-flex;
    background: var(--coal-2);
    border: 1px solid var(--edge);
    border-radius: 999px;
    padding: 3px;
    position: relative;
  }
  .toggle button {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .2s ease;
    position: relative;
    z-index: 1;
  }
  .toggle button.active { color: var(--coal-0); }
  .toggle .pill {
    position: absolute;
    top: 3px; bottom: 3px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    border-radius: 999px;
    transition: transform .25s cubic-bezier(.4,0,.2,1),
                width .25s cubic-bezier(.4,0,.2,1);
    z-index: 0;
  }

  /* ─── Search bar ─────────────────────────────────── */
  .search {
    display: flex;
    gap: 10px;
    margin: 18px 0;
  }
  .search input {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--coal-2);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    padding: 13px 16px;
    outline: none;
    transition: border-color .2s ease, background .2s ease;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus {
    border-color: var(--accent);
    background: var(--coal-1);
  }
  .search button {
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--coal-0);
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    border: 0;
    border-radius: var(--radius);
    padding: 0 26px;
    cursor: pointer;
    transition: filter .2s ease;
  }
  .search button:hover { filter: brightness(1.08); }
  .search button:disabled { opacity: .5; cursor: wait; }

  /* ─── Results panel ──────────────────────────────── */
  .results {
    flex: 1;
    min-height: 0;               /* critical for inner scroll */
    background: var(--coal-1);
    border: 1px solid var(--edge);
    border-radius: 14px;
    overflow: hidden;            /* clip rows to rounded corners */
    display: flex;
    flex-direction: column;
  }

  .results-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--edge);
    background: var(--coal-2);
  }

  .results-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;            /* the actual scroll */
    scrollbar-width: thin;
    scrollbar-color: var(--edge) transparent;
  }
  .results-body::-webkit-scrollbar { width: 8px; }
  .results-body::-webkit-scrollbar-thumb {
    background: var(--edge);
    border-radius: 8px;
  }
  .results-body::-webkit-scrollbar-track { background: transparent; }

  /* ─── Row ────────────────────────────────────────── */
  .row {
    display: grid;
    grid-template-columns: 20% 1fr;   /* 20% photo, rest info */
    gap: 16px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--coal-3);
    align-items: center;
    transition: background .15s ease;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--coal-2); }

  .row .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--coal-3), var(--coal-2));
    background-size: cover;
    background-position: center;
    border: 1px solid var(--edge);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 22px;
    user-select: none;
  }

  .row .info { min-width: 0; }
  .row .title {
    font-size: 15px;
    color: var(--text);
    margin: 0 0 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .subtitle {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11px;
  }
  .chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--coal-3);
    color: var(--text);
    border: 1px solid var(--edge);
    letter-spacing: .5px;
  }
  .chip.accent {
    color: var(--coal-0);
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    border-color: transparent;
  }

  /* ─── States ─────────────────────────────────────── */
  .state {
    padding: 48px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
  }
  .state .spinner {
    display: inline-block;
    width: 26px; height: 26px;
    border: 2px solid var(--edge);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .err { color: #e08b8b; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Music&nbsp;Catalog</h1>
      <span id="modeLabel">Artists &amp; People</span>
    </div>

    <div class="toggle" id="toggle" role="tablist">
      <div class="pill" id="pill"></div>
      <button class="active" data-mode="artists" role="tab">Artists</button>
      <button data-mode="albums" role="tab">Music</button>
    </div>
  </header>

  <div class="search">
    <input
      id="q"
      type="text"
      placeholder="Search…"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="go">Search</button>
  </div>

  <section class="results">
    <div class="results-head">
      <span id="headLeft">Results</span>
      <span id="headRight">&nbsp;</span>
    </div>
    <div class="results-body" id="body">
      <div class="state">Type something and hit <strong>Search</strong>.</div>
    </div>
  </section>
</div>

<script>
/* ────────────────────────────────────────────────────────────
   ⚙️  CONFIG — point each of these at the right EC2 instance.
   ──────────────────────────────────────────────────────────── */
const API_ARTISTS = "http://localhost:8000";   // Artists & People API
const API_ALBUMS  = "http://localhost:8001";   // Albums & Tracks API

/* ────────────────────────────────────────────────────────────
   State
   ──────────────────────────────────────────────────────────── */
const state = {
  mode: "artists",       // "artists" | "albums"
  loading: false,
};

const els = {
  toggle:   document.getElementById("toggle"),
  pill:     document.getElementById("pill"),
  modeLbl:  document.getElementById("modeLabel"),
  q:        document.getElementById("q"),
  go:       document.getElementById("go"),
  body:     document.getElementById("body"),
  headL:    document.getElementById("headLeft"),
  headR:    document.getElementById("headRight"),
};

/* ────────────────────────────────────────────────────────────
   Toggle
   ──────────────────────────────────────────────────────────── */
function positionPill() {
  const active = els.toggle.querySelector("button.active");
  if (!active) return;
  const tRect = els.toggle.getBoundingClientRect();
  const aRect = active.getBoundingClientRect();
  els.pill.style.width = aRect.width + "px";
  els.pill.style.transform = `translateX(${aRect.left - tRect.left - 3}px)`;
}

function setMode(mode) {
  state.mode = mode;
  els.toggle.querySelectorAll("button").forEach(b => {
    b.classList.toggle("active", b.dataset.mode === mode);
  });
  els.modeLbl.textContent = mode === "artists"
    ? "Artists & People"
    : "Music & Albums";
  els.q.placeholder = mode === "artists"
    ? "Search artists or people…"
    : "Search albums or tracks…";
  positionPill();
  els.body.innerHTML =
    '<div class="state">Type something and hit <strong>Search</strong>.</div>';
  els.headL.textContent = "Results";
  els.headR.innerHTML = "&nbsp;";
}

els.toggle.addEventListener("click", e => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn || btn.dataset.mode === state.mode) return;
  setMode(btn.dataset.mode);
});

window.addEventListener("resize", positionPill);

/* ────────────────────────────────────────────────────────────
   Fetch
   ──────────────────────────────────────────────────────────── */
async function apiGet(base, path, params = {}) {
  const url = new URL(base + path);
  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== null && v !== "") {
      url.searchParams.set(k, v);
    }
  });

  const res = await fetch(url, { headers: { Accept: "application/json" } });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  return res.json();
}

async function search() {
  if (state.loading) return;
  const q = els.q.value.trim();
  state.loading = true;
  els.go.disabled = true;

  els.headL.textContent = state.mode === "artists" ? "Artists" : "Music";
  els.headR.innerHTML = "&nbsp;";
  els.body.innerHTML = '<div class="state"><div class="spinner"></div><br>Searching…</div>';

  try {
    let rows = [];

    if (state.mode === "artists") {
      const [artists, people] = await Promise.all([
        apiGet(API_ARTISTS, "/artists", { q }),
        apiGet(API_ARTISTS, "/people",  { q }),
      ]);
      rows = [
        ...artists.map(r => ({ kind: "artist", data: r })),
        ...people.map(r  => ({ kind: "person", data: r })),
      ];
    } else {
      const [albums, tracks] = await Promise.all([
        apiGet(API_ALBUMS, "/albums", { name: q }),
        apiGet(API_ALBUMS, "/tracks", { name: q }),
      ]);
      rows = [
        ...albums.map(r => ({ kind: "album", data: r })),
        ...tracks.map(r => ({ kind: "track", data: r })),
      ];
    }

    els.headR.textContent = `${rows.length} result${rows.length === 1 ? "" : "s"}`;
    render(rows);
  } catch (err) {
    els.headR.innerHTML = "&nbsp;";
    els.body.innerHTML = `<div class="state err">Error: ${escapeHtml(err.message)}</div>`;
  } finally {
    state.loading = false;
    els.go.disabled = false;
  }
}

els.go.addEventListener("click", search);
els.q.addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});

/* ────────────────────────────────────────────────────────────
   Rendering
   ──────────────────────────────────────────────────────────── */
function render(rows) {
  if (rows.length === 0) {
    els.body.innerHTML = '<div class="state">No results found.</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  for (const r of rows) {
    const el = document.createElement("div");
    el.className = "row";

    const { thumbUrl, title, subtitle, chips } = describe(r);

    el.innerHTML = `
      <div class="thumb" style="${thumbUrl ? `background-image:url('${cssUrl(thumbUrl)}')` : ""}">
        ${thumbUrl ? "" : iconFor(r.kind)}
      </div>
      <div class="info">
        <p class="title">${escapeHtml(title)}</p>
        <p class="subtitle">${escapeHtml(subtitle || "")}</p>
        <div class="meta">${chips.map(c =>
          `<span class="chip ${c.accent ? "accent" : ""}">${escapeHtml(c.label)}</span>`
        ).join("")}</div>
      </div>
    `;
    frag.appendChild(el);
  }
  els.body.replaceChildren(frag);
}

function describe(r) {
  const d = r.data;

  if (r.kind === "artist") {
    const chips = [];
    if (d.artist_type) chips.push({ label: d.artist_type });
    if (d.is_active) chips.push({ label: "active", accent: true });
    if (d.genres) chips.push({ label: d.genres });
    if (d.album_count != null) chips.push({ label: `${d.album_count} album${d.album_count == 1 ? "" : "s"}` });
    return {
      thumbUrl: d.photo_url || null,
      title: d.artistic_name || "(unnamed artist)",
      subtitle: d.description || "",
      chips,
    };
  }

  if (r.kind === "person") {
    const chips = [];
    if (d.stage_name) chips.push({ label: d.stage_name });
    if (d.bands) chips.push({ label: d.bands });
    return {
      thumbUrl: d.photo_url || null,
      title: d.full_name || "(unnamed person)",
      subtitle: d.biography || "",
      chips,
    };
  }

  if (r.kind === "album") {
    const chips = [];
    if (d.release_year) chips.push({ label: String(d.release_year) });
    if (d.rating != null) chips.push({ label: `★ ${Number(d.rating).toFixed(1)}`, accent: true });
    if (d.genres) chips.push({ label: d.genres });
    if (d.track_count != null) chips.push({ label: `${d.track_count} track${d.track_count == 1 ? "" : "s"}` });
    return {
      thumbUrl: d.cover_url || null,
      title: d.album_name || "(untitled album)",
      subtitle: d.artist_name || "",
      chips,
    };
  }

  // track
  const chips = [];
  if (d.album_name) chips.push({ label: d.album_name });
  if (d.artist_name) chips.push({ label: d.artist_name });
  if (d.track_number != null) chips.push({ label: `#${d.track_number}` });
  if (d.duration_seconds != null) chips.push({ label: fmtDuration(d.duration_seconds) });
  return {
    thumbUrl: d.cover_url || null,
    title: d.track_name || "(untitled track)",
    subtitle: d.album_name ? `${d.album_name} — ${d.artist_name || ""}` : "",
    chips,
  };
}

function iconFor(kind) {
  return { artist: "♪", person: "☺", album: "◈", track: "♫" }[kind] || "•";
}

/* ────────────────────────────────────────────────────────────
   Utils
   ──────────────────────────────────────────────────────────── */
function fmtDuration(sec) {
  sec = Number(sec);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function escapeHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function cssUrl(url) {
  // prevent breaking out of the CSS url() with quotes
  return String(url).replace(/'/g, "%27").replace(/\)/g, "%29");
}

/* ────────────────────────────────────────────────────────────
   Boot
   ──────────────────────────────────────────────────────────── */
setMode("artists");
requestAnimationFrame(positionPill);
</script>
</body>
</html>
